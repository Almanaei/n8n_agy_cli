<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="60%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#shieldGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Outer Golden Shield -->
  <path d="M 256 64 C 336 64 416 80 416 80 C 416 256 368 376 256 440 C 144 376 96 256 96 80 C 96 80 176 64 256 64 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Navy Shield -->
  <path d="M 256 84 C 324 84 394 98 394 98 C 394 246 352 352 256 414 C 160 352 118 246 118 98 C 118 98 188 84 256 84 Z" 
        fill="url(#innerShield)" stroke="#F59E0B" stroke-width="3"/>

  <!-- Fire Safety & Protection Emblem (Flame) -->
  <path d="M 256 160 C 270 200 300 230 300 270 C 300 314 264 340 240 340 C 260 320 264 290 250 270 C 240 256 220 244 220 220 C 220 190 240 170 256 160 Z" 
        fill="url(#flameGrad)"/>
  
  <path d="M 240 220 C 248 244 270 260 270 286 C 270 316 248 334 230 334 C 242 320 246 300 236 284 C 230 274 218 266 218 250 C 218 234 230 226 240 220 Z" 
        fill="#FEF08A" opacity="0.9"/>

  <!-- Sound Waves / AI Voice Rings -->
  <path d="M 330 210 C 350 235 350 285 330 310" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <path d="M 355 190 C 385 225 385 295 355 330" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 182 210 C 162 235 162 285 182 310" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <path d="M 157 190 C 127 225 127 295 157 330" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Golden Stars & Banner Accent -->
  <polygon points="256,110 262,126 278,126 265,136 270,152 256,142 242,152 247,136 234,126 250,126" fill="#FCD34D"/>
</svg>
